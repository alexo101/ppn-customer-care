kind = "web"
previewPath = "/"
title = "Customer Support AI Orchestrator"
description = "A configurable AI support assistant that answers from a published article knowledge base, respects audience targets, and offers a human when the knowledge is not enough."
version = "1.0.0"
id = "artifacts/support-orchestrator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21787

[services.development]
run = "pnpm --filter @workspace/support-orchestrator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/support-orchestrator", "run", "build" ]
serve = "static"
publicDir = "artifacts/support-orchestrator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21787"
BASE_PATH = "/"

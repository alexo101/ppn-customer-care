kind = "web"
previewPath = "/"
title = "Customer Support AI Orchestrator"
description = "A configurable AI-powered customer support platform that classifies user intent, applies orchestration rules, and manages support conversations end-to-end. Designed for support teams who want intelligent routing, response generation, and analytics — all managed from an admin panel."
version = "1.0.0"
id = "artifacts/support-orchestrator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21787

[services.development]
run = "pnpm --filter @workspace/support-orchestrator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/support-orchestrator", "run", "build" ]
serve = "static"
publicDir = "artifacts/support-orchestrator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21787"
BASE_PATH = "/"

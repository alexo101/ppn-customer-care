          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/logs:
    get:
      operationId: listAnalyticsLogs
      tags: [analytics]
      summary: Get recent orchestrator logs for analytics
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Orchestrator logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorLog"

  # ── Appearance ────────────────────────────────────────────────────────────
  /appearance:
    get:
      operationId: getAppearance
      tags: [appearance]
      summary: Get chat appearance settings
      description: Returns the authenticated user's saved appearance, creating defaults if none exist.
      responses:
        "200":
          description: Appearance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
    put:
      operationId: updateAppearance
      tags: [appearance]
      summary: Update chat appearance settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceUpdate"
      responses:
        "200":
          description: Updated appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"

  /appearance/import:
    post:
      operationId: importAppearance
      tags: [appearance]
      summary: Import main styling from a website homepage
      description: Visits the given homepage, detects CTA color, background color, and logo, then saves them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAppearanceInput"
      responses:
        "200":
          description: Detected and saved appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAppearanceResult"
        "400":
          description: Invalid URL or import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return the signed-in workspace member and role
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Domain or invite denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Members ───────────────────────────────────────────────────────────────
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List invited workspace members
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
    post:
      operationId: inviteMember
      tags: [members]
      summary: Invite a papernest.com user with a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberInput"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Invalid invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}/invitation-token:
    post:
      operationId: createMemberInvitationToken
      tags: [members]
      summary: Create a new copyable invitation link for an invited member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          description: Member already joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [members]
      summary: Public status for an invitation token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationStatus"

  /invitations/redeem:
    post:
      operationId: redeemInvitation
      tags: [members]
      summary: Redeem an invitation token for the signed-in Google account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemInvitationInput"
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invalid, expired, or already used invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Signed-in email does not match the invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{id}:
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change a member role
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invalid role change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Revoke workspace access
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot remove this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    AgentSettings:
      type: object
      required:
        [agentId, prompt, targetAudience, llmProvider, llmModel, temperature]
      properties:
        agentId: { type: string }
        prompt: { type: string }
        targetAudience: { type: string }
        llmProvider: { type: string }
        llmModel: { type: string }
        temperature: { type: string }
        configuration: { type: object, additionalProperties: true }
    AgentSettingsInput:
      type: object
      properties:
        prompt: { type: string }
        targetAudience: { type: string }
        llmProvider: { type: string }
        llmModel: { type: string }
        temperature: { type: string }
        configuration: { type: object, additionalProperties: true }
    DeploymentToken:
      type: object
      required: [id, token, tokenPrefix]
      properties:
        id: { type: string }
        token:
          type: string
          writeOnly: true
        tokenPrefix: { type: string }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    # ── Agent ─────────────────────────────────────────────────────────────
    AgentEscalationMember:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"

    AgentEscalation:
      type: object
      required: [agentId, name, notifyAssignedMembers, members]
      properties:
        agentId: { type: string }
        name: { type: string }
        notifyAssignedMembers: { type: boolean }
        members:
          type: array
          items:
            $ref: "#/components/schemas/AgentEscalationMember"

    AgentEscalationInput:
      type: object
      required: [name, notifyAssignedMembers, memberIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        notifyAssignedMembers: { type: boolean }
        memberIds:
          type: array
          items: { type: string }

    AgentConversationSettings:
      type: object
      required:
        [
          agentId,
          autoCloseDays,
          autoCloseHours,
          autoCloseMinutes,
          closingMessage,
          welcomeMessage,
          escalationMessage,
        ]
      properties:
        agentId: { type: string }
        autoCloseDays: { type: number, minimum: 0, maximum: 365 }
        autoCloseHours: { type: number, minimum: 0, maximum: 23 }
        autoCloseMinutes: { type: number, minimum: 0, maximum: 59 }
        closingMessage: { type: string, maxLength: 2000 }
        welcomeMessage: { type: string, maxLength: 2000 }
        escalationMessage: { type: string, maxLength: 2000 }

    AgentConversationSettingsInput:
      type: object
      required:
        [
          autoCloseDays,
          autoCloseHours,
          autoCloseMinutes,
          closingMessage,
          welcomeMessage,
          escalationMessage,
        ]
      properties:
        autoCloseDays: { type: number, minimum: 0, maximum: 365 }
        autoCloseHours: { type: number, minimum: 0, maximum: 23 }
        autoCloseMinutes: { type: number, minimum: 0, maximum: 59 }
        closingMessage: { type: string, maxLength: 2000 }
        welcomeMessage: { type: string, maxLength: 2000 }
        escalationMessage: { type: string, maxLength: 2000 }

    InboxTeam:
      type: object
      required: [agentId, agentName, teamName, openCount]
      properties:
        agentId: { type: string }
        agentName: { type: string }
        teamName: { type: string }
        openCount: { type: number }

    EscalationAssignment:
      type: object
      required: [id, escalationId, memberId, isRead, createdAt, updatedAt]
      properties:
        id: { type: string }
        escalationId: { type: string }
        memberId: { type: string }
        isRead: { type: boolean }
        revokedAt:
          type: ["string", "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InboxEscalation:
      type: object
      required:
        [
          id,
          conversationId,
          agentId,
          agentName,
          teamName,
          status,
          priority,
          reason,
          category,
          subcategory,
          retrievedInformation,
          previousAnswer,
          context,
          isRead,
          assignmentState,
          assigneeMemberId,
          assigneeName,
          claimedAt,
          customerName,
          customerEmail,
          lastMessagePreview,
          lastActivityAt,
          createdAt,
          updatedAt,
          aiSummary,
          aiSummaryGeneratedAt,
        ]
      properties:
        id: { type: string }
        conversationId: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        teamName: { type: string }
        status:
          {
            type: string,
            enum: [open, in_progress, waiting_on_customer, resolved],
          }
        priority:
          {
            type: string,
            enum: [none, low, medium, high, urgent],
          }
        reason: { type: string }
        category: { type: string }
        subcategory: { type: string }
        retrievedInformation:
          type: array
          items:
            type: object
            additionalProperties: true
        previousAnswer: { type: string }
        context:
          type: object
          additionalProperties: true
        isRead: { type: boolean }
        assignmentState: { type: string, enum: [unassigned, assigned] }
        assigneeMemberId:
          type: ["string", "null"]
        assigneeName:
          type: ["string", "null"]
        claimedAt:
          type: ["string", "null"]
          format: date-time
        customerName:
          type: ["string", "null"]
        customerEmail:
          type: ["string", "null"]
        lastMessagePreview:
          type: ["string", "null"]
        lastActivityAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        aiSummary:
          type: ["string", "null"]
        aiSummaryGeneratedAt:
          type: ["string", "null"]
          format: date-time

    InboxEscalationUpdate:
      type: object
      properties:
        status:
          {
            type: string,
            enum: [open, in_progress, waiting_on_customer, resolved],
          }
        priority:
          {
            type: string,
            enum: [none, low, medium, high, urgent],
          }

    EscalationReplyInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 20000 }

    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: number }

    Agent:
      type: object
      required:
        [id, name, description, isEnabled, trustedDomains, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        trustedDomains:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    AgentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        trustedDomains:
          type: array
          items:
            type: string

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        trustedDomains:
          type: array
          items:
            type: string

    # ── Conversation ──────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [id, status, metadata, lastActivityAt, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        lastActivityAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        agentId:
          type: ["string", "null"]
        npsScore:
          type: ["number", "null"]
          minimum: 1
          maximum: 10

    ConversationInput:
      type: object
      properties:
        agentId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    ConversationUpdate:
      type: object
      properties:
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Question:
      type: object
      required:
        [id, conversationId, content, type, conversationStatus, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [question, unanswered, escalated]
        conversationStatus:
          type: string
        createdAt:
          type: string

    TrainingQuestion:
      type: object
      required: [id, agentId, content, createdAt, updatedAt]
      properties:
        id:
          type: string
        agentId:
          type: string
        content:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    TrainingQuestionInput:
      type: object
      required: [agentId, content]
      properties:
        agentId:
          type: string
        content:
          type: string
          maxLength: 2000

    TrainingQuestionUpdate:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000

    TrainingQuestionBulkInput:
      type: object
      required: [agentId, questions]
      properties:
        agentId:
          type: string
        questions:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 2000

    TrainingQuestionBulkResult:
      type: object
      required: [created, skipped, limitReached]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/TrainingQuestion"
        skipped:
          type: number
        limitReached:
          type: boolean

    # ── Message ───────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, conversationId, sender, content, metadata, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        sender:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string

    Citation:
      type: object
      required: [articleId, articleName]
      properties:
        articleId:
          type: string
        articleName:
          type: string
        sourceId:
          type: string
        sourceName:
          type: string
        chunkId:
          type: string

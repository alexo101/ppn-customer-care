openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Customer Support AI Orchestrator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Per-agent workspaces
  - name: conversations
    description: Chat conversation management
  - name: messages
    description: Messages within conversations
  - name: categories
    description: Intent classification categories
  - name: rules
    description: Orchestration rules
  - name: sources
    description: Knowledge sources and API connectors
  - name: targets
    description: Named audience targets for visitors, leads, and users
  - name: analytics
    description: Analytics and dashboard data
  - name: appearance
    description: Chat appearance and website style import
  - name: training
    description: Training questions the agent should attempt to answer
  - name: auth
    description: Registration without email verification codes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents for the authenticated user
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent and its nested data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/appearance:
    get:
      operationId: getAgentAppearance
      tags: [appearance]
      summary: Get appearance for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAgentAppearance
      tags: [appearance]
      summary: Update appearance for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceUpdate"
      responses:
        "200":
          description: Updated appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"

  /agents/{id}/appearance/import:
    post:
      operationId: importAgentAppearance
      tags: [appearance]
      summary: Import styling from a website for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAppearanceInput"
      responses:
        "200":
          description: Detected and saved appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAppearanceResult"
        "400":
          description: Invalid URL or import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Conversations ─────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: source
          schema:
            type: string
          description: Filter by conversation source. Use widget for live deployments, training for console sessions.
        - in: query
          name: fromDate
          schema:
            type: string
          description: Inclusive start date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: toDate
          schema:
            type: string
          description: Inclusive end date (YYYY-MM-DD or ISO 8601)
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update conversation status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /conversations/{id}/send:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message and get AI response
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: AI response with orchestration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/feedback:
    post:
      operationId: submitFeedback
      tags: [conversations]
      summary: Submit feedback for a message in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /conversations/{id}/logs:
    get:
      operationId: listConversationLogs
      tags: [conversations]
      summary: Get orchestrator logs for a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orchestrator logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorLog"

  /questions:
    get:
      operationId: listQuestions
      tags: [conversations]
      summary: List user questions from deployed agent conversations
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [question, unanswered, escalated]
          description: Filter by question type
        - in: query
          name: fromDate
          schema:
            type: string
          description: Inclusive start date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: toDate
          schema:
            type: string
          description: Inclusive end date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: limit
          schema:
            type: number
            default: 200
      responses:
        "200":
          description: Questions from live widget conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions:
    get:
      operationId: listTrainingQuestions
      tags: [training]
      summary: List training questions for an agent
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Training questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingQuestion"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTrainingQuestion
      tags: [training]
      summary: Create a training question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestion"
        "409":
          description: Question limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions/bulk:
    post:
      operationId: bulkCreateTrainingQuestions
      tags: [training]
      summary: Import training questions in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionBulkInput"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestionBulkResult"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions/{id}:
    patch:
      operationId: updateTrainingQuestion
      tags: [training]
      summary: Update a training question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrainingQuestion
      tags: [training]
      summary: Delete a training question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Intent Categories ─────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List intent categories
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntentCategory"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create an intent category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCategory"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update an intent category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete an intent category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Orchestrator Rules ────────────────────────────────────────────────────
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List orchestration rules
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorRule"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create an orchestration rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorRule"

  /agents/{agentId}/rule-authoring/messages:
    post:
      operationId: sendRuleAuthoringMessage
      tags: [rules]
      summary: Continue a conversational rule-authoring session
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleAuthoringRequest"
      responses:
        "200":
          description: The assistant response and current validated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleAuthoringResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Rule authoring provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update an orchestration rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorRule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete an orchestration rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /rules/{id}/categories:
    get:
      operationId: listRuleCategories
      tags: [rules]
      summary: List categories linked to a rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntentCategory"
    post:
      operationId: linkRuleCategory
      tags: [rules]
      summary: Link a category to a rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleCategoryLinkInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /rules/{id}/categories/{categoryId}:
    delete:
      operationId: unlinkRuleCategory
      tags: [rules]
      summary: Remove a category link from a rule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unlinked

  /rule-vocabularies:
    get:
      operationId: listRuleVocabularies
      tags: [rules]
      summary: List configurable rule operators and actions
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
            enum: [operator, action]
      responses:
        "200":
          description: Vocabularies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleVocabulary"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRuleVocabulary
      tags: [rules]
      summary: Add a custom operator or action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleVocabularyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleVocabulary"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rule-vocabularies/{id}:
    patch:
      operationId: updateRuleVocabulary
      tags: [rules]
      summary: Update a custom operator or action
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleVocabularyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleVocabulary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRuleVocabulary
      tags: [rules]
      summary: Delete a custom operator or action
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Knowledge Sources ─────────────────────────────────────────────────────
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List knowledge sources
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSource"
    post:
      operationId: createSource
      tags: [sources]
      summary: Create a knowledge source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"

  /sources/{id}:
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update a knowledge source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
    delete:
      operationId: deleteSource
      tags: [sources]
      summary: Delete a knowledge source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /sources/integrations:
    get:
      operationId: listSourceIntegrations
      tags: [sources]
      summary: List Notion and Confluence Replit Integration status
      responses:
        "200":
          description: Integration connection status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceIntegration"

  /sources/integrations/browse:
    get:
      operationId: browseSourceIntegration
      tags: [sources]
      summary: Browse Notion pages/databases or Confluence spaces/pages
      parameters:
        - in: query
          name: connectorName
          required: true
          schema:
            type: string
            enum: [notion, confluence]
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: spaceId
          schema:
            type: string
      responses:
        "200":
          description: Browse results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBrowseResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Provider not connected or access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sources/{id}/refresh:
    post:
      operationId: refreshSource
      tags: [sources]
      summary: Re-fetch and re-index an integration knowledge source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sources/upload:
    post:
      operationId: uploadSourceDocument
      tags: [sources]
      summary: Upload a Word document as a knowledge source
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SourceUploadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"

  # ── Audience Targets ──────────────────────────────────────────────────────
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List named audience targets
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTarget
      tags: [targets]
      summary: Create a named audience target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          description: Invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /targets/{id}:
    patch:
      operationId: updateTarget
      tags: [targets]
      summary: Update a named audience target
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          description: Invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTarget
      tags: [targets]
      summary: Delete a named audience target
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── API Connectors ────────────────────────────────────────────────────────
  /connectors:
    get:
      operationId: listConnectors
      tags: [sources]
      summary: List API connectors
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiConnector"
    post:
      operationId: createConnector
      tags: [sources]
      summary: Create an API connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConnector"

  /connectors/{id}:
    patch:
      operationId: updateConnector
      tags: [sources]
      summary: Update an API connector
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConnector"
    delete:
      operationId: deleteConnector
      tags: [sources]
      summary: Delete an API connector
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Analytics ─────────────────────────────────────────────────────────────
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/logs:
    get:
      operationId: listAnalyticsLogs
      tags: [analytics]
      summary: Get recent orchestrator logs for analytics
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            default: 100
      responses:
        "200":
          description: Orchestrator logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorLog"

  # ── Appearance ────────────────────────────────────────────────────────────
  /appearance:
    get:
      operationId: getAppearance
      tags: [appearance]
      summary: Get chat appearance settings
      description: Returns the authenticated user's saved appearance, creating defaults if none exist.
      responses:
        "200":
          description: Appearance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
    put:
      operationId: updateAppearance
      tags: [appearance]
      summary: Update chat appearance settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceUpdate"
      responses:
        "200":
          description: Updated appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"

  /appearance/import:
    post:
      operationId: importAppearance
      tags: [appearance]
      summary: Import main styling from a website homepage
      description: Visits the given homepage, detects CTA color, background color, and logo, then saves them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAppearanceInput"
      responses:
        "200":
          description: Detected and saved appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAppearanceResult"
        "400":
          description: Invalid URL or import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account without an email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "400":
          description: Invalid input or account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    # ── Agent ─────────────────────────────────────────────────────────────
    Agent:
      type: object
      required: [id, name, description, isEnabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    AgentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean

    # ── Conversation ──────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [id, status, metadata, lastActivityAt, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        lastActivityAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        agentId:
          type: ["string", "null"]

    ConversationInput:
      type: object
      properties:
        agentId:
          type: string
        metadata:
          type: object
          additionalProperties: true

    ConversationUpdate:
      type: object
      properties:
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Question:
      type: object
      required: [id, conversationId, content, type, conversationStatus, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [question, unanswered, escalated]
        conversationStatus:
          type: string
        createdAt:
          type: string

    TrainingQuestion:
      type: object
      required: [id, agentId, content, createdAt, updatedAt]
      properties:
        id:
          type: string
        agentId:
          type: string
        content:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    TrainingQuestionInput:
      type: object
      required: [agentId, content]
      properties:
        agentId:
          type: string
        content:
          type: string
          maxLength: 2000

    TrainingQuestionUpdate:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000

    TrainingQuestionBulkInput:
      type: object
      required: [agentId, questions]
      properties:
        agentId:
          type: string
        questions:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 2000

    TrainingQuestionBulkResult:
      type: object
      required: [created, skipped, limitReached]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/TrainingQuestion"
        skipped:
          type: number
        limitReached:
          type: boolean

    # ── Message ───────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, conversationId, sender, content, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        sender:
          type: string
        content:
          type: string
        createdAt:
          type: string

    SendMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        context:
          $ref: "#/components/schemas/ConversationContext"

    ConversationContext:
      type: object
      additionalProperties: false
      properties:
        currentUrl:
          type: string
        userRole:
          type: string
        referredClientId:
          type: string
        referredContractId:
          type: string

    SendMessageResult:
      type: object
      required: [message, response, stages, classification, shouldAskResolution]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        response:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/OrchestratorStage"
        classification:
          $ref: "#/components/schemas/ClassificationResult"
        shouldAskResolution:
          type: boolean

    FeedbackInput:
      type: object
      required: [messageId, rating]
      properties:
        messageId:
          type: string
        rating:
          type: string
          enum: [positive, negative]
        comment:
          type: ["string", "null"]

    # ── Orchestrator ──────────────────────────────────────────────────────
    OrchestratorStage:
      type: object
      required: [stage, name, status]
      properties:
        stage:
          type: number
        name:
          type: string
        status:
          type: string
        details:
          type: object
          additionalProperties: true

    ClassificationResult:
      type: object
      required: [primaryCategory, confidence, secondaryCategories, entities, rule]
      properties:
        primaryCategory:
          type: string
        primaryCategoryId:
          type: string
        confidence:
          type: number
        secondaryCategories:
          type: array
          items:
            type: string
        entities:
          type: object
          additionalProperties: true
        rule:
          type: string
        ruleId:
          type: string

    OrchestratorLog:
      type: object
      required: [id, conversationId, detectedCategory, confidenceScore, ruleUsed, resolutionStatus, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        messageId:
          type: ["string", "null"]
        detectedCategory:
          type: string
        confidenceScore:
          type: number
        secondaryCategories:
          type: array
          items:
            type: string
        detectedEntities:
          type: object
          additionalProperties: true
        ruleUsed:
          type: string
        dataSourcesQueried:
          type: array
          items:
            type: string
        promptAssembled:
          type: string
        tokensUsed:
          type: number
        latencyMs:
          type: number
        llmModel:
          type: string
        resolutionStatus:
          type: string
        createdAt:
          type: string

    # ── Intent Category ───────────────────────────────────────────────────
    IntentCategory:
      type: object
      required: [id, name, description, examples, confidenceThreshold, keywords, isEnabled, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: ["string", "null"]
        description:
          type: string
        examples:
          type: array
          items:
            type: string
        confidenceThreshold:
          type: number
        keywords:
          type: array
          items:
            type: string
        isEnabled:
          type: boolean
        sortOrder:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
        agentId:
          type: ["string", "null"]

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        agentId:
          type: string
        parentId:
          type: ["string", "null"]
        description:
          type: string
        examples:
          type: array
          items:
            type: string
        confidenceThreshold:
          type: number
        keywords:
          type: array
          items:
            type: string
        isEnabled:
          type: boolean
        sortOrder:
          type: number

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        parentId:
          type: ["string", "null"]
        description:
          type: string
        examples:
          type: array
          items:
            type: string
        confidenceThreshold:
          type: number
        keywords:
          type: array
          items:
            type: string
        isEnabled:
          type: boolean
        sortOrder:
          type: number

    # ── Orchestrator Rule ─────────────────────────────────────────────────
    OrchestratorRule:
      type: object
      required: [id, name, description, promptTemplate, priority, escalationTrigger, isEnabled, conditionOperator, action, categoryIds, sourceIds, connectorIds, audienceTargetIds, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        promptTemplate:
          type: string
        priority:
          type: number
        requiresClarificationPrompt:
          type: string
        escalationTrigger:
          type: boolean
        isEnabled:
          type: boolean
        conditionOperator:
          type: string
        action:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        sourceIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          items:
            type: string
        audienceTargetIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    RuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        agentId:
          type: string
        description:
          type: string
        promptTemplate:
          type: string
        priority:
          type: number
        requiresClarificationPrompt:
          type: string
        escalationTrigger:
          type: boolean
        isEnabled:
          type: boolean
        conditionOperator:
          type: string
        action:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        sourceIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          items:
            type: string
        audienceTargetIds:
          type: array
          items:
            type: string

    RuleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        promptTemplate:
          type: string
        priority:
          type: number
        requiresClarificationPrompt:
          type: string
        escalationTrigger:
          type: boolean
        isEnabled:
          type: boolean
        conditionOperator:
          type: string
        action:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        sourceIds:
          type: array
          items:
            type: string
        connectorIds:
          type: array
          items:
            type: string
        audienceTargetIds:
          type: array
          items:
            type: string

    RuleAuthoringMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000

    RuleAuthoringDraft:
      type: object
      required: [name, description, promptTemplate, priority, requiresClarificationPrompt, escalationTrigger, isEnabled, conditionOperator, action]
      properties:
        name:
          type: string
        description:
          type: string
        promptTemplate:
          type: string
        priority:
          type: number
          minimum: 0
          maximum: 100
        requiresClarificationPrompt:
          type: string
        escalationTrigger:
          type: boolean
        isEnabled:
          type: boolean
        conditionOperator:
          type: string
        action:
          type: string
        categoryIds:
          type: array
          items:
            type: string
          default: []
        sourceIds:
          type: array
          items:
            type: string
          default: []
        connectorIds:
          type: array
          items:
            type: string
          default: []
        audienceTargetIds:
          type: array
          items:
            type: string
          default: []

    RuleAuthoringRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/RuleAuthoringMessage"
        draft:
          $ref: "#/components/schemas/RuleAuthoringDraft"
        awaitingConfirmation:
          type: boolean
          default: false

    RuleAuthoringResponse:
      type: object
      required: [status, assistantMessage, unresolvedFields]
      properties:
        status:
          type: string
          enum: [clarifying, ready_for_confirmation, needs_changes, approved]
        assistantMessage:
          type: string
        draft:
          $ref: "#/components/schemas/RuleAuthoringDraft"
        unresolvedFields:
          type: array
          items:
            type: string

    RuleVocabulary:
      type: object
      required: [id, kind, label, slug, requiresSource, isBuiltin, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
        agentId:
          type: string
          nullable: true
        kind:
          type: string
          enum: [operator, action]
        label:
          type: string
        slug:
          type: string
        requiresSource:
          type: boolean
        isBuiltin:
          type: boolean
        sortOrder:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string

    RuleVocabularyInput:
      type: object
      required: [agentId, kind, label]
      properties:
        agentId:
          type: string
        kind:
          type: string
          enum: [operator, action]
        label:
          type: string
          maxLength: 80
        requiresSource:
          type: boolean
        sortOrder:
          type: number

    RuleVocabularyUpdate:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
        requiresSource:
          type: boolean
        sortOrder:
          type: number

    RuleCategoryLinkInput:
      type: object
      required: [categoryId]
      properties:
        categoryId:
          type: string

    # ── Knowledge Source ──────────────────────────────────────────────────
    KnowledgeSource:
      type: object
      required: [id, name, sourceType, connectionConfig, isEnabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        sourceType:
          type: string
        connectionConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    SourceInput:
      type: object
      required: [name, sourceType]
      properties:
        name:
          type: string
        agentId:
          type: string
        sourceType:
          type: string
        connectionConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean

    SourceUpdate:
      type: object
      properties:
        name:
          type: string
        sourceType:
          type: string
        connectionConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean

    SourceIntegration:
      type: object
      required: [connectorName, displayName, connected]
      properties:
        connectorName:
          type: string
        displayName:
          type: string
        connected:
          type: boolean
        connectionId:
          type: string
          nullable: true
        status:
          type: string
          nullable: true

    SourceBrowseItem:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [page, database, space]
        title:
          type: string
        parentTitle:
          type: string
        url:
          type: string

    SourceBrowseResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SourceBrowseItem"
        nextCursor:
          type: ["string", "null"]
        spaceTitle:
          type: string

    SourceUploadInput:
      type: object
      required: [file, agentId]
      properties:
        agentId:
          type: string
        name:
          type: string
        file:
          type: string
          format: binary

    # ── Audience Target ───────────────────────────────────────────────────
    TargetPersonType:
      type: string
      enum: [visitor, lead, user]

    TargetAttribute:
      type: string
      enum:
        - email
        - phone_number
        - phone_number_prefix
        - name
        - user_id
        - company
        - country
        - city
        - current_page_url
        - referring_url
        - browser_language

    TargetOperator:
      type: string
      enum:
        - is
        - is_not
        - contains
        - does_not_contain
        - starts_with
        - ends_with
        - is_known
        - is_unknown

    TargetMatchMode:
      type: string
      enum: [all, any]

    TargetCondition:
      type: object
      required: [id, personType, attribute, operator, value]
      properties:
        id:
          type: string
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string

    TargetConditionInput:
      type: object
      required: [personType, attribute, operator]
      properties:
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string
          maxLength: 200

    Target:
      type: object
      required: [id, name, description, matchMode, isEnabled, conditions, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        isEnabled:
          type: boolean
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/TargetCondition"
        createdAt:
          type: string
        updatedAt:

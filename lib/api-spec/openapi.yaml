          enum: [positive, negative]
        comment:
          type: ["string", "null"]

    NpsInput:
      type: object
      required: [score]
      properties:
        score:
          type: number
          minimum: 1
          maximum: 10

    # ── Orchestrator ──────────────────────────────────────────────────────
    OrchestratorStage:
      type: object
      required: [stage, name, status]
      properties:
        stage:
          type: number
        name:
          type: string
        status:
          type: string
        details:
          type: object
          additionalProperties: true

    OrchestratorLog:
      type: object
      required:
        [
          id,
          conversationId,
          articlesUsed,
          articleIds,
          answerable,
          resolutionStatus,
          createdAt,
        ]
      properties:
        id:
          type: string
        conversationId:
          type: string
        messageId:
          type: ["string", "null"]
        articlesUsed:
          type: array
          items:
            type: string
        articleIds:
          type: array
          items:
            type: string
        answerable:
          type: boolean
        promptAssembled:
          type: string
        tokensUsed:
          type: number
        latencyMs:
          type: number
        llmModel:
          type: string
        resolutionStatus:
          type: string
        createdAt:
          type: string
        agentId:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]


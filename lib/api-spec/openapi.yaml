      type: string
      enum: [all, any]

    TargetCondition:
      type: object
      required: [id, personType, attribute, operator, value]
      properties:
        id:
          type: string
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string

    TargetConditionInput:
      type: object
      required: [personType, attribute, operator]
      properties:
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string
          maxLength: 200

    Target:
      type: object
      required:
        [id, name, description, matchMode, conditions, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/TargetCondition"
        createdAt:
          type: string
        updatedAt:
          type: string

    TargetInput:
      type: object
      required: [name, agentId, conditions]
      properties:
        name:
          type: string
          maxLength: 80
        agentId:
          type: string
        description:
          type: string
          maxLength: 240
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          minItems: 0
          maxItems: 20
          description: An empty list matches everyone and does not filter by any criteria.
          items:
            $ref: "#/components/schemas/TargetConditionInput"

    TargetUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 240
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          minItems: 0
          maxItems: 20
          description: An empty list matches everyone and does not filter by any criteria.
          items:
            $ref: "#/components/schemas/TargetConditionInput"

    # ── API Connector ─────────────────────────────────────────────────────
    ApiConnector:
      type: object
      required:
        [
          id,
          name,
          endpointPattern,
          authType,
          authConfig,
          isEnabled,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        endpointPattern:
          type: string
        authType:
          type: string
        authConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ConnectorInput:
      type: object
      required: [name, endpointPattern, authType]
      properties:
        name:
          type: string
        agentId:
          type: string
        endpointPattern:
          type: string
        authType:
          type: string
        authConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean

    ConnectorUpdate:
      type: object
      properties:
        name:
          type: string
        endpointPattern:
          type: string
        authType:
          type: string
        authConfig:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean

    # ── Analytics ─────────────────────────────────────────────────────────
    AnalyticsSummary:
      type: object
      required:
        [
          totalConversations,
          activeConversations,
          resolvedConversations,
          escalatedConversations,
          avgConfidenceScore,
          totalMessages,
          positiveRatings,
          negativeRatings,
          avgResolutionTimeMs,
          avgInteractionsPerConversation,
          estimatedTotalCostUsd,
        ]
      properties:
        totalConversations:
          type: number
        activeConversations:
          type: number
        resolvedConversations:
          type: number
        escalatedConversations:
          type: number
        avgConfidenceScore:
          type: number
        totalMessages:
          type: number
        positiveRatings:
          type: number
        negativeRatings:
          type: number
        avgResolutionTimeMs:
          type: number
        avgInteractionsPerConversation:
          type: number
        estimatedTotalCostUsd:
          type: number

    # ── Appearance ────────────────────────────────────────────────────────
    AppearanceTagStyle:
      type: string
      enum: [solid, outline, soft]

    Appearance:
      type: object
      required: [id, ctaColor, backgroundColor, tagStyle, createdAt, updatedAt]
      properties:
        id:
          type: string
        websiteUrl:
          type: ["string", "null"]
        ctaColor:
          type: string
        backgroundColor:
          type: string
        logoUrl:
          type: ["string", "null"]
        tagText:
          type: ["string", "null"]
          maxLength: 20
        tagStyle:
          $ref: "#/components/schemas/AppearanceTagStyle"
        importedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    AppearanceUpdate:
      type: object
      properties:
        websiteUrl:
          type: ["string", "null"]
        ctaColor:
          type: string
        backgroundColor:
          type: string
        logoUrl:
          type: ["string", "null"]
        tagText:
          type: ["string", "null"]
          maxLength: 20
        tagStyle:
          $ref: "#/components/schemas/AppearanceTagStyle"

    ImportAppearanceInput:
      type: object
      required: [url]
      properties:
        url:
          type: string

    ImportAppearanceResult:
      type: object
      required: [appearance]
      properties:
        appearance:
          $ref: "#/components/schemas/Appearance"
        pageTitle:
          type: ["string", "null"]
        ctaColorCandidates:
          type: array
          items:
            type: string
        backgroundColorCandidates:
          type: array
          items:
            type: string
        logoCandidates:
          type: array
          items:
            type: string

    MemberRole:
      type: string
      enum: [editor, viewer]

    MemberStatus:
      type: string
      enum: [invited, active]

    CurrentMember:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"

    WorkspaceMember:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitedByEmail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InviteMemberInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"

    IssuedInvitation:
      type: object
      required:
        [
          id,
          email,
          role,
          status,
          createdAt,
          updatedAt,
          token,
          expiresAt,
          invitePath,
        ]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitedByEmail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        invitePath:
          type: string

    InvitationStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [valid, expired, redeemed, invalid]

    RedeemInvitationInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UpdateMemberInput:
      type: object
      required: [role]

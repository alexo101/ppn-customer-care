    ArticleStatus:
      type: string
      enum: [draft, published, archived]

    ArticleIndexStatus:
      type: string
      enum: [idle, indexing, ready, empty, error]

    KnowledgeArticle:
      type: object
      required:
        [
          id,
          agentId,
          title,
          description,
          bodyHtml,
          status,
          targetId,
          indexStatus,
          chunkCount,
          imageCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        agentId:
          type: string
        title:
          type: string
        description:
          type: string
        bodyHtml:
          type: string
        status:
          $ref: "#/components/schemas/ArticleStatus"
        targetId:
          type: string
          nullable: true
        publishedAt:
          type: string
          nullable: true
        indexStatus:
          $ref: "#/components/schemas/ArticleIndexStatus"
        indexError:
          type: string
          nullable: true
        chunkCount:
          type: number
        imageCount:
          type: number
        imageFailedCount:
          type: number
        lastIndexedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    ArticleInput:
      type: object
      required: [agentId, title, bodyHtml]
      properties:
        agentId:
          type: string
        title:
          type: string
          maxLength: 200
        description:
          type: string
        bodyHtml:
          type: string
        targetId:
          type: string
          nullable: true

    ArticleUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        bodyHtml:
          type: string
        targetId:
          type: string
          nullable: true

    KnowledgeAsset:
      type: object
      required:
        [
          id,
          articleId,
          mimeType,
          originalName,
          byteSize,
          position,
          altText,
          processingStatus,
        ]
      properties:
        id:
          type: string
        articleId:
          type: string
        mimeType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        originalName:
          type: string
        byteSize:
          type: number
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        position:
          type: number
        altText:
          type: string
        processingStatus:
          type: string

    KnowledgeAssetUrl:
      allOf:
        - $ref: "#/components/schemas/KnowledgeAsset"
        - type: object
          required: [url]
          properties:

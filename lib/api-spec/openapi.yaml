          maxLength: 500

    # ── Audience Target ───────────────────────────────────────────────────
    TargetPersonType:
      type: string
      enum: [visitor, lead, user]

    TargetAttribute:
      type: string
      enum:
        - email
        - phone_number
        - phone_number_prefix
        - name
        - user_id
        - company
        - country
        - city
        - current_page_url
        - referring_url
        - browser_language

    TargetOperator:
      type: string
      enum:
        - is
        - is_not
        - contains
        - does_not_contain
        - starts_with
        - ends_with
        - is_known
        - is_unknown

    TargetMatchMode:
      type: string
      enum: [all, any]

    TargetCondition:
      type: object
      required: [id, personType, attribute, operator, value]
      properties:
        id:
          type: string
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string

    TargetConditionInput:
      type: object
      required: [personType, attribute, operator]
      properties:
        personType:
          $ref: "#/components/schemas/TargetPersonType"
        attribute:
          $ref: "#/components/schemas/TargetAttribute"
        operator:
          $ref: "#/components/schemas/TargetOperator"
        value:
          type: string
          maxLength: 200

    Target:
      type: object
      required:
        [id, name, description, matchMode, conditions, createdAt, updatedAt]
      properties:

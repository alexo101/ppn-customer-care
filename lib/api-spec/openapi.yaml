        name:
          type: string
        description:
          type: string
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/TargetCondition"
        createdAt:
          type: string
        updatedAt:
          type: string

    TargetInput:
      type: object
      required: [name, agentId, conditions]
      properties:
        name:
          type: string
          maxLength: 80
        agentId:
          type: string
        description:
          type: string
          maxLength: 240
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          minItems: 0
          maxItems: 20
          description: An empty list matches everyone and does not filter by any criteria.
          items:
            $ref: "#/components/schemas/TargetConditionInput"

    TargetUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 240
        matchMode:
          $ref: "#/components/schemas/TargetMatchMode"
        conditions:
          type: array
          minItems: 0
          maxItems: 20
          description: An empty list matches everyone and does not filter by any criteria.
          items:
            $ref: "#/components/schemas/TargetConditionInput"


          type: string
        referredClientId:
          type: string
        referredContractId:
          type: string

    SendMessageResult:
      type: object
      required: [message, response, stages, shouldAskResolution, answerable]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        response:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/OrchestratorStage"
        shouldAskResolution:
          type: boolean
        answerable:
          type: boolean
        articlesUsed:
          type: array
          items:
            type: string

    EscalateConversationInput:
      type: object

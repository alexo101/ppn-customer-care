openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Customer Support AI Orchestrator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Per-agent workspaces
  - name: conversations
    description: Chat conversation management
  - name: messages
    description: Messages within conversations
  - name: categories
    description: Intent classification categories
  - name: rules
    description: Orchestration rules
  - name: sources
    description: Knowledge sources and API connectors
  - name: targets
    description: Named audience targets for visitors, leads, and users
  - name: analytics
    description: Analytics and dashboard data
  - name: appearance
    description: Chat appearance and website style import
  - name: training
    description: Training questions the agent should attempt to answer
  - name: auth
    description: Signed-in workspace member identity
  - name: members
    description: Papernest.com team invites and roles
  - name: escalations
    description: Agent escalation groups and assigned support inbox
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents for the authenticated user
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent and its nested data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/appearance:
    get:
      operationId: getAgentAppearance
      tags: [appearance]
      summary: Get appearance for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAgentAppearance
      tags: [appearance]
      summary: Update appearance for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppearanceUpdate"
      responses:
        "200":
          description: Updated appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"

  /agents/{id}/appearance/import:
    post:
      operationId: importAgentAppearance
      tags: [appearance]
      summary: Import styling from a website for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAppearanceInput"
      responses:
        "200":
          description: Detected and saved appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAppearanceResult"
        "400":
          description: Invalid URL or import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agents/{id}/settings:
    get:
      operationId: getAgentSettings
      tags: [agents]
      summary: Get per-agent prompt and LLM settings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
    patch:
      operationId: updateAgentSettings
      tags: [agents]
      summary: Update per-agent prompt and LLM settings
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"

  /agents/{id}/deployment-token:
    post:
      operationId: createAgentDeploymentToken
      tags: [agents]
      summary: Create a one-time-view deployment token
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Deployment token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentToken"

  /agents/{id}/escalation:
    get:
      operationId: getAgentEscalation
      tags: [escalations]
      summary: Get escalation routing for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Escalation routing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEscalation"
    patch:
      operationId: updateAgentEscalation
      tags: [escalations]
      summary: Update escalation routing for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentEscalationInput"
      responses:
        "200":
          description: Updated escalation routing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEscalation"

  /agents/{id}/conversation-settings:
    get:
      operationId: getAgentConversationSettings
      tags: [agents]
      summary: Get conversation auto-close settings for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationSettings"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAgentConversationSettings
      tags: [agents]
      summary: Update conversation auto-close settings for an agent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentConversationSettingsInput"
      responses:
        "200":
          description: Updated conversation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConversationSettings"

  /inbox/teams:
    get:
      operationId: listInboxTeams
      tags: [escalations]
      summary: List escalation teams visible to the current member
      responses:
        "200":
          description: Escalation teams with configured names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxTeam"

  /inbox/escalations:
    get:
      operationId: listInboxEscalations
      tags: [escalations]
      summary: List escalations visible in the current member's inbox
      parameters:
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: status
          schema:
            {
              type: string,
              enum: [open, in_progress, waiting_on_customer, resolved, all],
              default: open,
            }
        - in: query
          name: unreadOnly
          schema: { type: boolean, default: false }
        - in: query
          name: assignee
          schema:
            {
              type: string,
              enum: [everyone, mine, unassigned],
              default: everyone,
            }
      responses:
        "200":
          description: Assigned escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxEscalation"

  /inbox/team-escalations:
    get:
      operationId: listTeamInboxEscalations
      tags: [escalations]
      summary: List all escalations for an escalation team
      parameters:
        - in: query
          name: agentId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema:
            {
              type: string,
              enum: [open, in_progress, waiting_on_customer, resolved, all],
              default: open,
            }
        - in: query
          name: unreadOnly
          schema: { type: boolean, default: false }
        - in: query
          name: assignee
          schema:
            {
              type: string,
              enum: [everyone, mine, unassigned],
              default: everyone,
            }
      responses:
        "200":
          description: Team escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxEscalation"

  /inbox/escalations/unread-count:
    get:
      operationId: getInboxUnreadCount
      tags: [escalations]
      summary: Count unread assigned escalations
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /inbox/escalations/{id}/read:
    post:
      operationId: markEscalationRead
      tags: [escalations]
      summary: Mark an assigned escalation as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationAssignment"

  /inbox/escalations/{id}/claim:
    post:
      operationId: claimEscalation
      tags: [escalations]
      summary: Claim an unassigned escalation for the current member
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Claimed escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxEscalation"
        "409":
          description: Escalation is already claimed

  /inbox/escalations/{id}/reply:
    post:
      operationId: replyToEscalation
      tags: [escalations]
      summary: Reply to an assigned escalation as a human
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationReplyInput"
      responses:
        "201":
          description: Human message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /inbox/escalations/{id}:
    patch:
      operationId: updateInboxEscalation
      tags: [escalations]
      summary: Update an inbox escalation status or priority
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxEscalationUpdate"
      responses:
        "200":
          description: Updated escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxEscalation"
        "404":
          description: Escalation not found

  /inbox/escalations/{id}/resolve:
    post:
      operationId: resolveEscalation
      tags: [escalations]
      summary: Resolve an assigned escalation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxEscalation"

  /inbox/escalations/{id}/summary:
    post:
      operationId: generateInboxEscalationSummary
      tags: [escalations]
      summary: Generate a one-time AI summary for an inbox escalation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Escalation including the stored summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxEscalation"
        "404":
          description: Escalation not found
        "502":
          description: Summary generation failed

  /agents/{agentId}/sources/{sourceId}:
    post:
      operationId: assignAgentSource
      tags: [agents]
      summary: Assign a knowledge source to an agent
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        - in: path
          name: sourceId
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
      responses:
        "201":
          description: Assigned

  # ── Conversations ─────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      parameters:
        - in: query
          name: agentId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: source
          schema:
            type: string
          description: Filter by conversation source. Use widget for live deployments, training for console sessions.
        - in: query
          name: fromDate
          schema:
            type: string
          description: Inclusive start date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: toDate
          schema:
            type: string
          description: Inclusive end date (YYYY-MM-DD or ISO 8601)
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update conversation status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /conversations/{id}/send:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message and get AI response
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: AI response with orchestration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/escalate:
    post:
      operationId: escalateConversation
      tags: [conversations]
      summary: Escalate an unanswered conversation to the agent inbox
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateConversationInput"
      responses:
        "200":
          description: Conversation escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalateConversationResult"
        "400":
          description: Invalid escalation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/feedback:
    post:
      operationId: submitFeedback
      tags: [conversations]
      summary: Submit feedback for a message in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /conversations/{id}/nps:
    post:
      operationId: submitConversationNps
      tags: [conversations]
      summary: Submit an NPS score after an automatic conversation close
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NpsInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: NPS cannot be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations/{id}/logs:
    get:
      operationId: listConversationLogs
      tags: [conversations]
      summary: Get orchestrator logs for a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Orchestrator logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrchestratorLog"

  /questions:
    get:
      operationId: listQuestions
      tags: [conversations]
      summary: List user questions from deployed agent conversations
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [question, unanswered, escalated]
          description: Filter by question type
        - in: query
          name: fromDate
          schema:
            type: string
          description: Inclusive start date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: toDate
          schema:
            type: string
          description: Inclusive end date (YYYY-MM-DD or ISO 8601)
        - in: query
          name: limit
          schema:
            type: number
            default: 200
      responses:
        "200":
          description: Questions from live widget conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions:
    get:
      operationId: listTrainingQuestions
      tags: [training]
      summary: List training questions for an agent
      parameters:
        - in: query
          name: agentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Training questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingQuestion"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTrainingQuestion
      tags: [training]
      summary: Create a training question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestion"
        "409":
          description: Question limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions/bulk:
    post:
      operationId: bulkCreateTrainingQuestions
      tags: [training]
      summary: Import training questions in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionBulkInput"
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestionBulkResult"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training-questions/{id}:
    patch:
      operationId: updateTrainingQuestion
      tags: [training]
      summary: Update a training question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingQuestionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingQuestion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrainingQuestion
      tags: [training]
      summary: Delete a training question
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
